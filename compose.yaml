services:
  postgres:
    image: postgres:16
    container_name: eduplatform-postgres
    environment:
      POSTGRES_DB: eduplatform
      POSTGRES_USER: eduplatform
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduplatform -d eduplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eduplatform:1.0
    container_name: eduplatform-app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eduplatform
      SPRING_DATASOURCE_USERNAME: eduplatform
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: